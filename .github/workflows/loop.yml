name: The Loop

# Trigger = pushing a spec. That is the whole dispatcher.
# No cron: Austin disabled every scheduled loop run on 2026-07-30 and asked more than once
# that it stay that way. A push is a deliberate act, so this honours "runs are manual" while
# removing the part that was actually work - opening a session and playing dispatcher.
# RETIRED 2026-08-20. The push trigger is gone. Actions no longer runs specs --
# Desktop\loop-local\dispatch.py on the Windows box does, because a run that finishes
# on a runner and never reaches the box is not a finished run (defect 4, hit twice).
# Kept dispatchable by hand only, so the history and the rig are not thrown away.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Single spec filename to run (blank = every specs/*.md with status: ready)'
        required: false

# NO workflow-level concurrency group. It used to be `group: loop`, which serialised every run
# in the repo - push a second spec while the first was going and it sat queued. On Actions every
# run gets its own runner and its own workspace, so there is nothing to clobber and nothing to
# lock. Austin 2026-08-06: "I want to start pushing multiple runs at the same time."
#
# The real collision is narrower and is handled per-spec on the `run` job below: the SAME spec
# running twice at once would double-execute its rows and race the same loop/<version> branch.
# Two DIFFERENT specs share nothing.

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      count:  ${{ steps.p.outputs.count }}
    steps:
      # fetch-depth: 0 so the push-scoped selection below can diff against github.event.before.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Parse EVERY spec before a single token is spent. This is the old -WhatIf, and it is
      # the reason a bad spec costs nothing instead of costing a night. Since 2026-08-09 it is
      # also where a row with no `verify:` command is rejected - see ci/parse-spec.ps1.
      - id: p
        shell: pwsh
        run: |
          $only = '${{ inputs.spec }}'

          # A PUSH runs the spec(s) that push touched - nothing else.
          #
          # 2026-08-08: this globbed every specs/*.md still marked `ready`, so pushing
          # omen-corpus-2.0 also re-fired omen-3.7 minutes after omen-3.7's own run had
          # finished (run 31235908719). Two full executions of the same 5 rows, real opus
          # spend, a second redundant PR, and Austin watching the loop "duplicate itself".
          # ci/checkoff.ps1 now closes the underlying cause (rows get [x] written back, so a
          # finished spec stops being pending); this stays as the second line of defence.
          $specs =
            if ($only) {
              @(Get-Item "specs/$only")
            } elseif ('${{ github.event_name }}' -eq 'push') {
              $before = '${{ github.event.before }}'
              $touched = @(
                if ($before -and $before -notmatch '^0+$') {
                  git diff --name-only $before '${{ github.sha }}' -- 'specs/*.md'
                } else {
                  git show --name-only --pretty=format: '${{ github.sha }}' -- 'specs/*.md'
                }) | Where-Object { $_ }
              # A DELETED spec is touched but gone from disk. That must run nothing at all -
              # falling through to "every ready spec" here would re-introduce the exact
              # duplicate this block exists to kill, triggered by a cleanup commit.
              $names = @($touched | Where-Object { Test-Path $_ })
              if ($names.Count) {
                Write-Host "push touched: $($names -join ', ')"
                @($names | ForEach-Object { Get-Item $_ })
              } elseif ($touched.Count) {
                Write-Host "push only removed spec files ($($touched -join ', ')) - nothing to run"
                @()
              } else {
                # Should be unreachable: the workflow only triggers on specs/**.md. If it
                # happens, say so loudly rather than silently running nothing.
                Write-Host "::warning::push changed no readable spec file - falling back to every ready spec"
                Get-ChildItem specs -Filter *.md
              }
            } else {
              Get-ChildItem specs -Filter *.md
            }

          $rows    = @()
          $skipped = @()
          foreach ($s in $specs) {
            # A voided or finished spec must never take the rest of the push down with it -
            # Austin 2026-08-05: one VOID spec sitting in specs/ crashed the plan job for every
            # future push until this was caught. Skip it here, before parse-spec.ps1 ever sees
            # it - its own hard Fail() stays as the safety net for a spec matrixed in directly.
            $statusLine = [regex]::Match((Get-Content $s.FullName -Raw), '(?m)^status:\s*(.+?)\s*$')
            $st = if ($statusLine.Success) { $statusLine.Groups[1].Value } else { '' }
            if ($st -and $st -notin @('ready', 'running')) {
              Write-Host "$($s.Name): status is '$st', not ready - skipping"
              $skipped += "$($s.BaseName) (status: $st)"; continue
            }
            $json = "parsed-$($s.BaseName).json"
            pwsh ci/parse-spec.ps1 -Spec $s.FullName -Out $json
            if ($LASTEXITCODE -ne 0) { throw "spec $($s.Name) failed to parse - nothing ran" }
            $p = Get-Content $json -Raw | ConvertFrom-Json
            $pending = @($p.tasks | Where-Object { -not $_.done }).Count
            if ($pending -eq 0) {
              Write-Host "$($s.Name): nothing pending, skipping"
              $skipped += "$($s.BaseName) (all rows already [x])"; continue
            }
            $rows += @{ spec = $s.Name; version = $p.version; repo = $p.repo; pending = $pending }
          }
          $m = @{ include = $rows } | ConvertTo-Json -Depth 6 -Compress
          "matrix=$m" >> $env:GITHUB_OUTPUT
          "count=$($rows.Count)" >> $env:GITHUB_OUTPUT
          ($skipped -join "`n") | Set-Content skipped.txt

      - name: Notify start + ETA
        if: steps.p.outputs.count != '0'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          $m = '${{ steps.p.outputs.matrix }}' | ConvertFrom-Json
          # Specs run in parallel, so the ETA is the LONGEST spec, not the sum. 25 min is the
          # per-ATTEMPT ceiling and a row gets up to 3 attempts, so this is the realistic case
          # and the run is hard-capped at 300 min of task time regardless.
          $eta = ($m.include | ForEach-Object { $_.pending * 25 } | Measure-Object -Maximum).Maximum
          $lines = $m.include | ForEach-Object { "  $($_.version) - $($_.pending) rows -> $($_.repo)" }
          @("$($m.include.Count) spec(s) started, running in parallel.", "", $lines, "",
            "ETA: under $eta min. Every row is confirmed by running its own verify command.") |
            Set-Content body.txt
          bash ci/notify.sh start "Loop started - ETA $eta min" body.txt

      # A push that runs nothing used to produce ZERO notifications - no start, no done, no
      # alarm - which is indistinguishable from the workflow crashing before it began. Austin
      # 2026-08-09: every push gets exactly one answer. This is the whole answer for an empty
      # one, and no other job runs.
      - name: Notify nothing-pending
        if: steps.p.outputs.count == '0'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Nothing to run - the push touched no spec with pending rows."
            echo
            cat skipped.txt
            echo
            echo "A spec whose rows are all [x] is finished. /plan the next version."
          } > body.txt
          bash ci/notify.sh done "Loop - nothing pending" body.txt

  run:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 330          # under the 6h hosted-runner ceiling; replaces loop-guard.ps1
    # contents: write is for ci/checkoff.ps1 pushing [x] back into specs/. A GITHUB_TOKEN push
    # deliberately does NOT trigger another workflow run, so checking off rows cannot start a
    # second loop - that is the reason the write-back uses this token and not LOOP_GH_TOKEN.
    permissions:
      contents: write
    strategy:
      fail-fast: false            # one spec dying must never take the others with it
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    # Per-SPEC, not per-repo: omen-3.6 and paze-1.0 run side by side, but pushing omen-3.6
    # twice queues the second behind the first instead of double-running its rows and racing
    # the same loop/omen-3.6-* branch. This is the only lock the CI rig needs.
    concurrency:
      group: loop-${{ matrix.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.LOOP_GH_TOKEN }}
          path: work

      - run: npm i -g @anthropic-ai/claude-code

      # THE SHARED BRAIN. Syncthing keeps Austin's two laptops carrying the same
      # ~/.claude/skills; it cannot reach a GitHub runner or a cloud routine, because neither
      # has a home directory or a Syncthing daemon. Git can reach all four.
      #
      # So the vault's committed `.claude/` is the single source, and it is STAGED INTO the
      # target repo's working tree here, before the model starts. Claude Code auto-loads
      # `.claude/skills/` and `.claude/agents/` from its working directory, so no flag is
      # needed and a skill behaves identically in CI and on the desk.
      #
      # --ignore-existing, never --delete: a target repo that ships its OWN skill of the same
      # name wins. The shared kit is a floor, not an override, and this step can never remove
      # a file the repo committed.
      - name: Stage the shared skill/agent kit from the vault
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.LOOP_GH_TOKEN }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:$GH_TOKEN@github.com/aharger3/obsidian-vault.git" kit
          cd kit && git sparse-checkout set .claude && cd ..
          for d in skills agents plugins; do
            [ -d "kit/.claude/$d" ] || continue
            mkdir -p "work/.claude/$d"
            # graphify and obsidian are third-party skills Austin uses interactively in the
            # vault. They are in the kit so his laptops get them from git, but they are noise
            # in a code repo - every skill's description costs input tokens on every row, and
            # an Obsidian-markdown skill has nothing to say to tradingbot.
            rsync -a --ignore-existing \
              --exclude 'graphify/' --exclude 'obsidian/' \
              "kit/.claude/$d/" "work/.claude/$d/"
            echo "staged $d: $(ls "work/.claude/$d" | tr '\n' ' ')"
            # The staged kit must NEVER end up in the PR - it is scaffolding, not work, and a
            # `git add -A` later in this job would otherwise commit the vault's skills into
            # tradingbot. .git/info/exclude is local to this checkout and is not itself a
            # tracked file, so this leaves no trace in the diff.
            printf '/.claude/%s/\n' "$d" >> work/.git/info/exclude
          done
          rm -rf kit

      # The runner shipped the Claude CLI and nothing else, so any row whose verify is
      # "python X.py exits 0" failed on a missing import rather than on its own logic. Non-fatal
      # by design: a target repo with no requirements.txt, or a dep that will not install, must
      # not stop the LLM rows - but note that it WILL now fail that row's verify honestly,
      # which is the correct outcome rather than a silent pass.
      - name: Install the target repo's Python deps
        continue-on-error: true
        run: |
          if [ -f work/requirements.txt ]; then
            python3 -m pip install --quiet -r work/requirements.txt
          else
            echo "no requirements.txt in target repo, skipping"
          fi

      - shell: pwsh
        run: pwsh ci/parse-spec.ps1 -Spec "specs/${{ matrix.spec }}" -Out parsed.json

      - name: Execute
        shell: pwsh
        env:
          # opus bills the Max SUBSCRIPTION through this token (Austin 2026-08-11), not
          # pay-per-token dollars. ANTHROPIC_API_KEY stays passed only as the documented
          # fallback: run-spec.ps1 nulls every key before each task and sets exactly the one its
          # tier names, which is the only reason the console key cannot silently outrank this.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          ZAI_API_KEY:        ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
          # Not a model key - a data key. tradingbot's polygon_feed.fetch_day() needs it to
          # backfill 1-min bars that data_archive/ does not already carry, and a spec row that
          # silently skips uncovered days quietly shrinks every n downstream.
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
        run: pwsh ci/run-spec.ps1 -Parsed parsed.json -WorkDir "$PWD/work" -Out "result-${{ matrix.version }}.json"

      # A branch + PR, never a push straight to main - keeps a diff to look at if something's
      # off. It is merged when at least ONE row was confirmed by its verify command.
      #
      # The old rule was "merge only if zero rows failed", and it cost more than it saved:
      # omen-3.4's PRs sat open for a day, main never reflected the finished rows, and every
      # later push re-ran the whole spec from scratch on real spend, twice. A partial PR is
      # still work that PASSED ITS OWN CHECK - and the rows that failed left their edits on the
      # same branch either way, so holding the branch back only loses the confirmed half. If
      # NOTHING was confirmed the PR stays open, because then there is genuinely nothing to
      # trust and the run pages blocked.
      - name: Open PR with the work, merge if anything was confirmed
        env:
          GH_TOKEN: ${{ secrets.LOOP_GH_TOKEN }}
        run: |
          # run-spec.ps1 writes its result after every row, so this file exists unless the
          # script died before row zero. Default to 0 rather than failing the step under -e:
          # "nothing confirmed" is the right reading of a missing result, and report says so.
          DONE=$(jq '.done // 0' "result-${{ matrix.version }}.json" 2>/dev/null || echo 0)
          cd work
          git config user.name  "the-loop"
          git config user.email "loop@austinharger.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "no file changes"
            echo "MERGED=$([ "$DONE" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_ENV"
            exit 0
          fi
          git checkout -b "loop/${{ matrix.version }}-${{ github.run_id }}"
          git add -A
          git commit -m "loop: ${{ matrix.version }}"
          git push -u origin HEAD
          PR_URL=$(gh pr create --fill --title "loop: ${{ matrix.version }}" \
            --body "Automated run. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          # Two specs pointing at the SAME target repo merge concurrently: the second PR is
          # behind main by the time it is squashed and `gh pr merge` exits non-zero. Under
          # bash -e that killed the whole step, so the jq line below never stamped resultUrl
          # and the notification lost its PR link. Retry after refreshing the branch, and
          # treat a final failure as "not merged" rather than as a dead step.
          MERGED=0
          if [ "$DONE" -gt 0 ]; then
            for i in 1 2 3; do
              if gh pr merge "$PR_URL" --squash --delete-branch; then MERGED=1; break; fi
              gh pr update-branch "$PR_URL" >/dev/null 2>&1 || true
              sleep $((i * 5))
            done
            [ "$MERGED" = 1 ] || echo "::warning::$PR_URL did not merge after 3 tries - another loop run in the same repo probably landed first; its rows stay unchecked and re-run next push"
          fi
          echo "MERGED=$MERGED" >> "$GITHUB_ENV"
          jq --arg u "$PR_URL" '.resultUrl = $u' "../result-${{ matrix.version }}.json" > /tmp/r.json
          mv /tmp/r.json "../result-${{ matrix.version }}.json"

      # Only after the work is on main. A [x] whose code never landed is worse than no [x] at
      # all: the next run would skip the row and build on an artifact that does not exist.
      - name: Check off the rows that passed verify
        if: env.MERGED == '1'
        run: |
          git config user.name  "the-loop"
          git config user.email "loop@austinharger.com"
          # Two specs finishing at once both push [x] to main. The old loop did
          # `pull --rebase --autostash || true` and pushed regardless: a CONFLICTING rebase
          # left the repo mid-rebase with HEAD at a partially applied commit, all three
          # pushes then failed against that state, and in the worst case HEAD:main pushed a
          # half-rebased tree. checkoff.ps1 is idempotent (it only ever inserts a missing
          # [x]), so the safe shape is reset-to-origin, re-apply, push - never rebase.
          for i in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            pwsh ci/checkoff.ps1 -Spec "specs/${{ matrix.spec }}" -Result "result-${{ matrix.version }}.json"
            [ -z "$(git status --porcelain specs/)" ] && { echo "spec unchanged"; exit 0; }
            git add specs/
            git commit -q -m "loop: check off verified rows in ${{ matrix.version }} [skip ci]"
            git push origin HEAD:main && exit 0
            echo "check-off push lost the race, re-applying on top of main"
            sleep $((i * 3))
          done
          echo "::warning::could not push the spec check-off after 5 tries"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.version }}
          path: result-*.json

  # The loop dying before it starts must not be silent. 2026-08-06 run 31118549809: GitHub
  # could not allocate a hosted runner, `plan` was cancelled at 15 minutes with zero steps run,
  # and every downstream job was SKIPPED - so the whole push produced no notification at all.
  #
  # This job needs nothing and always runs. Its condition covers EXACTLY ONE case: `plan` never
  # produced a usable answer. Anything after a successful plan belongs to `report`, which owns
  # the single closing notification.
  #
  # 2026-08-09: `report` used to also fire here, because its gate was `needs.plan.outputs.count
  # != '0'` and a failed plan has NO output - so an empty string compared unequal to '0', report
  # ran, found no artifacts, and paged "Loop produced no result" alongside this job's "Loop
  # never started". One broken spec, two high-priority pages, neither of which was wrong. The
  # gate below is now `plan.result == 'success'`, so exactly one of these two can ever fire.
  alarm:
    needs: [plan, run, report]
    if: always() && (needs.plan.result == 'cancelled' || needs.plan.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Page if the run never really happened
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n' \
            "No spec row ran. Nothing was spent." \
            "" \
            "  plan: ${{ needs.plan.result }}" \
            "" \
            "plan FAILURE = a spec in specs/ did not parse; the plan job log names the file" \
            "and the line. The most common cause now is a row with no verify: command." \
            "Fix the spec and push again." \
            "" \
            "plan CANCELLED with no steps = GitHub could not allocate a hosted runner. Not" \
            "your fault, nothing to fix: re-run the failed jobs on the run page, or trigger" \
            "The Loop manually from the Actions tab." > body.txt
          bash ci/notify.sh blocked "Loop never started" body.txt

  report:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # 25, not 5. It used to run a full Claude Code turn over a vault clone and blow a 5-minute
    # job timeout, which took the notifications down with it (run 31122686346: 16 rows landed,
    # Austin was paged "Loop never started"). The model is gone from this job entirely now -
    # see ci/vault-sync.ps1 - so this is headroom, not a requirement.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # continue-on-error: a run that died before writing any result JSON has no artifact at
      # all, and v4 hard-errors on "no artifacts found". That must not kill the job that is
      # supposed to say so - the zero-results case is handled in the notification step below.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { path: results, merge-multiple: true }

      # Austin 2026-08-02: "My obsidian projects are always outdated." 2026-08-09: "all mds go
      # in my obsidian, but i want the summary as a link because it would be too much to read
      # in a notification." So the readable version is a real note in the vault, and the push
      # notification links to it.
      #
      # No model runs here. ci/vault-sync.ps1 splices each ROW'S OWN sentence into the note -
      # the previous version had one glm agent rewrite the whole doc from the results, which is
      # both the "one brain" Austin rejected and a step that could delete text no run touched.
      #
      # continue-on-error, because this sits IN FRONT of the notifications. On omen-3.5 the old
      # version's `gh pr create` failed, `set -e` killed the step, and the notification behind
      # it never ran - a 0/3 run reached Austin as silence.
      - name: Write the run summary into the vault
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.LOOP_GH_TOKEN }}
        run: |
          set -e
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/aharger3/obsidian-vault.git" vault
          cd vault && git config user.name the-loop && git config user.email loop@austinharger.com && cd ..
          # Straight to main. This is markdown that was squash-merged on sight anyway.
          # 2026-08-08 (omen-3.7): this push died with "failed to push some refs" and NOBODY
          # heard about it - continue-on-error swallowed the step and the notification silently
          # lost its Results button, so the doc stayed stale, which is the exact complaint this
          # step exists to answer. Retry, then say so out loud.
          # Same race as the check-off, and worse: two concurrent runs whose specs name the
          # SAME `doc:` note edit the same lines, so `pull --rebase` conflicts, `|| true`
          # swallows it, and the note silently never updates. vault-sync.ps1 is idempotent -
          # the run block is replaced in place, bullets dedupe on exact text, and an already
          # struck line is skipped - so re-applying on a fresh origin/main is safe and is
          # the only shape that survives a conflicting sibling run.
          for i in 1 2 3 4 5; do
            (cd vault && git fetch --quiet --depth 1 origin main && git reset --quiet --hard origin/main)
            pwsh ci/vault-sync.ps1 -Results results -VaultDir vault -DocOut vault-doc.txt
            cd vault
            if [ -n "$(git status --porcelain)" ]; then
              git add -A && git commit -q -m "loop: run summary"
            elif [ $i -eq 1 ]; then
              echo "vault already current"; exit 0
            fi
            if git push origin HEAD:main; then
              DOC=$(cat ../vault-doc.txt 2>/dev/null || true)
              if [ -n "$DOC" ]; then
                ENC=$(printf '%s' "$DOC" | sed 's/ /%20/g')
                echo "VAULT_URL=https://github.com/aharger3/obsidian-vault/blob/main/$ENC" >> "$GITHUB_ENV"
                # obsidian:// opens the note in his own app, correctly rendered, on the phone he
                # is actually holding. `file=` takes the vault-relative path WITHOUT .md.
                # Vault name is literally "Austin's Vault" - the apostrophe must be %27.
                echo "VAULT_OBSIDIAN=obsidian://open?vault=Austin%27s%20Vault&file=$(printf '%s' "${DOC%.md}" | sed 's/ /%20/g')" >> "$GITHUB_ENV"
              fi
              exit 0
            fi
            cd ..
            echo "vault push lost the race, re-applying on top of main"
            sleep $((i * 3))
          done
          echo "VAULT_STALE=1" >> "$GITHUB_ENV"
          echo "::warning::vault summary could not be pushed after 3 tries"
          exit 1

      # ONE closing notification per run - `done` if the run stands on its own, `blocked` if it
      # needs him. The four-type channel became three on 2026-08-09: `recommend` is gone, and
      # the questions/ideas/tasks each row raised ride inside this message, tagged with the row
      # that raised them. Austin: "so the content is not coming from one brain."
      - name: Summary + closing notification
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          $all = @(Get-ChildItem results -Filter *.json -Recurse -ErrorAction SilentlyContinue |
                   ForEach-Object { Get-Content $_ -Raw | ConvertFrom-Json })

          # No result file at all = the run job died before run-spec.ps1 wrote one (bad
          # checkout, npm install, spec re-parse). run-spec.ps1 writes after EVERY row now, so
          # reaching here means it never got past row zero.
          if (-not $all.Count) {
            @("The run job produced no result file, so NO spec row can be confirmed.",
              "", "  run job: ${{ needs.run.result }}", "",
              "This is a crash before the task loop, not a failed task. Open the run page,",
              "read the first red step in the 'run' job, fix that, and push again.") |
              Set-Content body.txt
            bash ci/notify.sh blocked "Loop produced no result" body.txt
            exit 0
          }

          function Short($s, $n) {
            $s = ("$s" -replace '\s+', ' ').Trim()
            if ($s.Length -gt $n) { $s.Substring(0, $n) + '...' } else { $s }
          }

          # --- the rendered report: full depth, one tap away, never in the notification ------
          $md = @("# Loop run", "")
          foreach ($r in $all) {
            $md += "## $($r.version) - $($r.done)/$($r.total) confirmed"
            $md += "", "**Target:** $($r.target)", ""
            $md += "| row | state | model | attempts | min | verify | what it did |", "|---|---|---|---|---|---|---|"
            foreach ($t in $r.tasks) {
              $md += "| $($t.id) | $($t.state) | $($t.tier) | $($t.attempts) | $($t.minutes) | exit $($t.verifyExit) | $(("$($t.note)" -replace '\|','\|')) |"
            }
            $md += ""
            foreach ($s in @(@{k='questions';h='Questions'}, @{k='ideas';h='Ideas'}, @{k='humanTasks';h='Human tasks'})) {
              $items = @($r.($s.k))
              if (-not $items.Count) { continue }
              $md += "### $($s.h)", ""
              foreach ($i in $items) { $md += "- **$($i.id)** - $($i.text)" }
              $md += ""
            }
          }
          ($md -join "`n") | Set-Content $env:GITHUB_STEP_SUMMARY

          # --- the notification: each row's own sentence, nothing re-summarised -------------
          $totDone = ($all | Measure-Object done -Sum).Sum
          $totAll  = ($all | Measure-Object total -Sum).Sum
          $blocked = @($all | ForEach-Object { $_.blocked } | Where-Object { $_ })

          # PLAIN, not note. Austin 2026-08-09: "its very code talk - hard to understand what was
          # productive." $t.note is the engineer line (filenames, exit codes, metric deltas) and
          # it belongs in the table on the run page and in the vault note. $t.plain is the same
          # row's own jargon-free sentence - still that row's brain, not a summarizer's.
          # Falls back to note so a result file written by an older run still says something.
          function Say($t) { if ("$($t.plain)".Trim()) { $t.plain } else { $t.note } }

          $body = @("$totDone of $totAll rows confirmed across $($all.Count) spec(s).", "")
          foreach ($r in $all) {
            $pr = if ($r.resultUrl) { " $($r.resultUrl)" } else { '' }
            $body += "$($r.version) -> $($r.repo)  ($($r.done)/$($r.total))$pr"
            foreach ($t in $r.tasks | Where-Object { $_.state -eq 'done' }) {
              $body += "  DONE  $(Short (Say $t) 150)"
            }
            foreach ($t in $r.tasks | Where-Object { $_.state -eq 'failed' }) {
              $body += "  STUCK ($($t.id), tried $($t.attempts)x)  $(Short (Say $t) 140)"
            }
            # Words, not sigils. `? T4 ...` / `! T4 ...` / `> T4 ...` needed a decoder ring.
            $marks = @(@{k='questions';m='ASKS YOU:'}, @{k='ideas';m='IDEA:'}, @{k='humanTasks';m='DO:'})
            $extra = @()
            foreach ($s in $marks) {
              foreach ($i in @($r.($s.k))) { $extra += "  $($s.m) $(Short $i.text 140)" }
            }
            if ($extra.Count) { $body += ''; $body += $extra }
            $body += ''
          }
          if ($blocked.Count) {
            $body += "NEEDS YOU:"
            foreach ($b in $blocked) { $body += "  $b" }
            $body += ''
          }
          if ($env:VAULT_STALE) {
            $body += "Your Obsidian note did NOT update this run (push failed 3x) - the Summary button is stale.", ''
          }
          $body += if ($env:VAULT_URL) { 'Tap this notification to open the full write-up in Obsidian.' }
                   else                { "Full per-row table: $env:RUN_URL" }

          # Blocked is reserved for "the loop cannot go on without you" - a missing key, or a
          # run that confirmed nothing at all. Austin 2026-08-09: a failed row inside an
          # otherwise good run is listed in `done`, not paged. Blocked is the only type allowed
          # to wake anyone, and it stays that way by not firing for 5-of-6.
          $needsHim = ($blocked.Count -gt 0) -or ($totDone -eq 0)
          $type  = if ($needsHim) { 'blocked' } else { 'done' }
          $title = if ($blocked.Count) { "Loop blocked - $($blocked.Count) fix(es) needed" }
                   elseif ($totDone -eq 0) { "Loop confirmed nothing - 0/$totAll" }
                   else { "Loop done - $totDone/$totAll" }
          $body | Set-Content body.txt

          # Buttons, not more text. The readable destination is the Obsidian note; the CI run
          # page drops to last because it is the one he pressed and the one that was useless.
          $env:SUMMARY_URL = if ($env:VAULT_URL) { $env:VAULT_URL }
                             else { ($all | Where-Object { $_.resultUrl } | Select-Object -First 1).resultUrl }
          $env:OBSIDIAN_URL = $env:VAULT_OBSIDIAN
          bash ci/notify.sh $type $title body.txt

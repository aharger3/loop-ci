name = "loop-watchdog"
main = "worker.js"
compatibility_date = "2026-08-07"

# No public URL. This is a cron worker - the fetch() dry-run handler is a convenience, not the
# product, and the account has no workers.dev subdomain registered. `node check.test.js` runs
# the exact same check() locally, so the dry run did not need a URL to stay testable.
workers_dev = false

# 20 min tick against worker.js's 25 min window - the overlap is what makes a dropped tick
# survivable. Change one and change the other. 72 invocations a day, free plan is 100k.
[triggers]
crons = ["*/20 * * * *"]
